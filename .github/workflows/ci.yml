# .github/workflows/ci.yml
name: ArogyaVani Production CI

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./test_ci_vault.db
      INVITE_CODES: TEST-OWNER-CODE,SECOND-HOUSEHOLD-CODE
      SECRET_SALT: ci-test-salt-2026
      GEMINI_API_KEY: dummy-ci-key-for-offline-tests

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Unit & Integration Tests (Scrubber, Zero-Knowledge Crypto, Roles, Guardrails)
        run: |
          pytest -v