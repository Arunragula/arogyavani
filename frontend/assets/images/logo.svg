<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Curavault healthcare logo</title>
  <desc id="desc">A teal medical cross, navy stethoscope, and supportive teal hand beside the Curavault wordmark.</desc>
  <defs>
