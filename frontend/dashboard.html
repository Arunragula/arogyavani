<!-- frontend/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Health Workspace — CuraVault AI</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/assets/images/logo.svg" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="top-header">
    <div class="container header-inner">
      <a href="/" class="brand-link">
        <img src="/assets/images/logo.svg" alt="Logo" class="brand-logo" />
        <span>CuraVault<span class="brand-accent">AI</span></span>
      </a>

      <!-- Desktop Tabs (Hidden on Mobile because Mobile uses Native Bottom Bar!) -->
      <div class="segmented-control desktop-only">
        <button onclick="switchTab('scanner')" id="dt-tab-scanner" class="seg-btn active">
          <i data-lucide="scan-line" style="width:15px;height:15px;"></i> Scanner
        </button>
        <button onclick="switchTab('vault')" id="dt-tab-vault" class="seg-btn">
          <i data-lucide="folder-heart" style="width:15px;height:15px;"></i> Family Vault
        </button>
        <button onclick="switchTab('chat')" id="dt-tab-chat" class="seg-btn">
          <i data-lucide="message-square-heart" style="width:15px;height:15px;"></i> Ask Health AI
        </button>
      </div>

      <!-- Language Selector (Switching this translates open reports live!) -->
      <div style="display:flex; align-items:center; gap:8px;">
        <select id="languageSelect" onchange="handleLanguageChange()" class="input-field" style="width:auto; padding:7px 10px; font-weight:700; font-size:0.8rem;">
          <option value="English">🌐 English</option>
          <option value="Hindi">🇮🇳 हिन्दी (Hindi)</option>
          <option value="Hinglish">🇮🇳 Hinglish</option>
          <option value="Telugu">🇮🇳 తెలుగు (Telugu)</option>
          <option value="Tamil">🇮🇳 தமிழ் (Tamil)</option>
          <option value="Kannada">🇮🇳 ಕನ್ನಡ (Kannada)</option>
          <option value="Malayalam">🇮🇳 മലയാളം (Malayalam)</option>
          <option value="Arabic">🇸🇦 العربية (Arabic)</option>
          <option value="Urdu">🇵🇰 اردو (Urdu)</option>
          <option value="Spanish">🇪🇸 Español</option>
        </select>
        <span id="userSessionBadge" class="badge badge-teal desktop-only">⚡ Guest</span>
        <button onclick="logoutSession()" class="btn-icon" title="Sign Out">
          <i data-lucide="log-out" style="width:16px;height:16px;"></i>
        </button>
      </div>
    </div>

    <!-- FAMILY PROFILES BAR -->
    <div class="sub-bar">
      <div class="container sub-bar-inner">
        <div class="pills-scroll" id="familyPillsContainer"></div>
      </div>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main class="container" style="padding-top:20px;">

    <!-- VIEW 1: SCANNER -->
    <section id="view-scanner" class="space-y">
      <div class="card space-y">
        <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;">
          <div>
            <h2 style="font-size:1.1rem; font-weight:800;">Decode Medical Document</h2>
            <p style="font-size:0.78rem; color:var(--text-muted);">Family Profile: <strong id="activeMemberBadge" style="color:var(--primary-dark); text-transform:uppercase;">self</strong></p>
          </div>

          <div class="segmented-control">
            <button id="mode-report" onclick="setScanMode('report')" class="seg-btn active">🧪 Lab Report</button>
            <button id="mode-rx" onclick="setScanMode('prescription')" class="seg-btn">💊 Prescription</button>
          </div>
        </div>

        <label for="fileInput" class="dropzone">
          <div style="width:48px;height:48px;border-radius:14px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;margin-bottom:10px;">
            <i data-lucide="camera" style="width:24px;height:24px;"></i>
          </div>
          <p style="font-weight:800; font-size:0.95rem;">Tap to Snap Photo or Upload PDF (Up to 10 Pages)</p>
          <p style="font-size:0.76rem; color:var(--text-muted); margin-top:4px;">🔒 Personal names, phone numbers & IDs are stripped locally</p>
          <input id="fileInput" type="file" multiple accept="image/*,application/pdf" class="hidden" onchange="handleFileSelect(event)" />
        </label>

        <div id="selectedFilesBox" class="hidden" style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; background:#F8FAFC; padding:12px; border-radius:14px; border:1px solid var(--border);">
          <div id="filePills" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
          <button id="analyzeBtn" onclick="submitAnalysis()" class="btn btn-primary" style="width:100%;">
            <i data-lucide="sparkles" style="width:16px;height:16px;"></i> Decode & Save to Vault
          </button>
        </div>

        <div id="loadingBox" class="hidden" style="text-align:center; padding:24px;">
          <p style="font-weight:800; color:var(--primary-dark);" id="loadingText">Protecting personal details & decoding medical data...</p>
        </div>
      </div>

      <!-- RESULTS AREA -->
      <div id="resultsContainer" class="hidden space-y"></div>
    </section>

    <!-- VIEW 2: FAMILY VAULT -->
    <section id="view-vault" class="hidden space-y">
      <div class="card" style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px;">
        <div style="display:flex; align-items:center; gap:14px;">
          <div id="vaultAvatar" style="width:48px;height:48px;border-radius:14px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;">S</div>
          <div>
            <div style="display:flex; align-items:center; gap:8px;">
              <h2 id="vaultMemberName" style="font-size:1.15rem; font-weight:800;">Self</h2>
              <span id="vaultMemberRelation" class="badge badge-teal">Self</span>
            </div>
            <p id="vaultMemberMeta" style="font-size:0.78rem; color:var(--text-muted); margin-top:2px;"></p>
            <p id="vaultMemberConditions" style="font-size:0.78rem; color:var(--primary-dark); font-weight:700;"></p>
          </div>
        </div>
        <button onclick="openMemberModal()" class="btn btn-soft">
          <i data-lucide="user-plus" style="width:16px;height:16px;"></i> Edit / Add Member
        </button>
      </div>

      <div class="card space-y">
        <h3 style="font-size:0.95rem; font-weight:800;">Saved Health History</h3>
        <div id="vaultTimelineList" class="space-y"></div>
      </div>
    </section>

    <!-- VIEW 3: ASK HEALTH AI -->
    <section id="view-chat" class="hidden space-y">
      <div class="card space-y">
        <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;">
          <div>
            <h2 style="font-size:1.1rem; font-weight:800;">Ask Health & History Assistant</h2>
            <p style="font-size:0.78rem; color:var(--text-muted);">Asking for: <strong id="chatMemberBadge" style="color:var(--primary-dark);">self</strong></p>
          </div>
          <label class="badge badge-teal" style="cursor:pointer;">
            <input type="checkbox" id="useHistoryToggle" checked />
            Personalize with Past Health Records
          </label>
        </div>

        <div style="display:flex; gap:8px;">
          <input id="chatInput" type="text" placeholder="Describe symptoms or ask about past reports..." class="input-field" onkeydown="if(event.key==='Enter') submitQuestion()" />
          <button onclick="submitQuestion()" class="btn btn-primary" style="white-space:nowrap;">Ask AI</button>
        </div>

        <div id="chatResponseContainer" class="space-y"></div>
      </div>
    </section>

  </main>

  <!-- NATIVE MOBILE APP BOTTOM NAVIGATION BAR -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-nav-grid">
      <button onclick="switchTab('scanner')" id="mb-tab-scanner" class="mobile-nav-item active">
        <i data-lucide="scan-line" style="width:20px;height:20px;"></i><span>Scanner</span>
      </button>
      <button onclick="switchTab('vault')" id="mb-tab-vault" class="mobile-nav-item">
        <i data-lucide="folder-heart" style="width:20px;height:20px;"></i><span>Vault</span>
      </button>
      <button onclick="switchTab('chat')" id="mb-tab-chat" class="mobile-nav-item">
        <i data-lucide="message-square-heart" style="width:20px;height:20px;"></i><span>Ask AI</span>
      </button>
      <a href="/about" class="mobile-nav-item">
        <i data-lucide="shield" style="width:20px;height:20px;"></i><span>Privacy</span>
      </a>
    </div>
  </nav>

  <!-- FLOATING AUDIO BAR -->
  <div id="audioPlayerBar" class="audio-bar hidden">
    <div style="flex:1; min-width:0;">
      <p id="audioBarTitle" style="font-size:0.75rem; font-weight:700; color:#5EEAD4; margin-bottom:4px;">Speaking...</p>
      <audio id="globalAudio" controls style="width:100%; height:32px;"></audio>
    </div>
    <button onclick="closeAudioBar()" class="btn-icon" style="background:transparent; color:#fff; border:none;">✕</button>
  </div>

  <!-- FAMILY PROFILE BOTTOM SHEET / MODAL -->
  <div id="memberModal" class="modal-backdrop hidden">
    <div class="modal-sheet space-y">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:1.05rem; font-weight:800;">Family Member Profile</h3>
        <button onclick="closeMemberModal()" class="btn-icon">✕</button>
      </div>
      <div class="space-y">
        <input id="m_id" type="text" placeholder="Profile ID (e.g., self, mom, dad)" class="input-field" />
        <input id="m_name" type="text" placeholder="Name (e.g., Amma / Mom)" class="input-field" />
        <div class="grid-2">
          <input id="m_rel" type="text" placeholder="Relationship (Mother)" class="input-field" />
          <input id="m_age" type="text" placeholder="Age (54 Years)" class="input-field" />
        </div>
        <div class="grid-2">
          <input id="m_gender" type="text" placeholder="Gender" class="input-field" />
          <input id="m_bg" type="text" placeholder="Blood Group (O+)" class="input-field" />
        </div>
        <input id="m_cond" type="text" placeholder="Known Conditions (Diabetes, BP)" class="input-field" />
      </div>
      <button onclick="saveFamilyMember()" class="btn btn-primary" style="width:100%; padding:13px;">Save Profile</button>
    </div>
  </div>

  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
