[project]
name = "arogyavani"
version = "1.0.0"
description = "ArogyaVani (CuraVault AI) — Encrypted Medical Report & Prescription Literacy Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.5",
    "cryptography>=43.0.1",
    "slowapi>=0.1.9",
    "google-genai>=1.2.0",
    "edge-tts>=6.1.12",
    "pymupdf>=1.24.10",
    "pymupdf4llm>=0.0.17",
    "rapidocr-onnxruntime>=1.3.24",
    "pillow>=10.4.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]