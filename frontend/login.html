<!-- frontend/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unlock Family Vault — Arogyavani AI</title>
  <link rel="icon" href="/assets/images/logo.svg" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="top-header">
    <div class="container header-inner">
      <a href="/" class="brand-link">
        <img src="/assets/images/logo.svg" alt="Logo" class="brand-logo" />
        <span>Arogyavani<span class="brand-accent">AI</span></span>
      </a>
      <a href="/" class="btn btn-outline">← Home</a>
    </div>
  </header>

  <main class="container" style="max-width:440px; padding-top:36px;">
    <div class="card space-y">
      <div>
        <span class="badge badge-teal">Friends & Family Beta</span>
        <h1 style="font-size:1.4rem; font-weight:700; margin-top:6px;">Enter Your Vault Invite Code</h1>
        <p style="font-size:0.82rem; color:var(--text-muted); margin-top:4px;">
          Your secret code unlocks your household's Zero-Knowledge encrypted vault. Neither our company nor developers can view your stored reports without your code.
        </p>
      </div>

      <div id="loginErrorBox" class="hidden" style="background:var(--danger-soft); color:var(--danger); padding:10px 12px; border-radius:10px; font-size:0.8rem; font-weight:600;"></div>

      <form onsubmit="submitInviteCodeLogin(event)" class="space-y">
        <div>
          <label for="inviteCodeInput" style="font-size:0.78rem; font-weight:600;">Household Invite Code or Family Role Code</label>
          <input id="inviteCodeInput" type="password" required placeholder="Enter your household invite code" class="input-field" style="margin-top:4px; font-weight:600; letter-spacing:0.04em;" />
        </div>

        <label style="display:flex; align-items:flex-start; gap:8px; font-size:0.76rem; color:var(--text-muted); background:#F9FAFB; padding:10px; border-radius:10px; border:1px solid var(--border); cursor:pointer;">
          <input id="betaConsentCheck" type="checkbox" checked style="margin-top:3px;" />
          <span>
            <strong>Beta & Educational Consent:</strong> I understand this tool simplifies medical information for educational purposes only and is not a substitute for a doctor's advice. Personal identifiers are reduced before AI analysis.
          </span>
        </label>

        <button id="loginSubmitBtn" type="submit" class="btn btn-primary" style="width:100%; padding:12px;">
          Unlock Family Vault
        </button>
      </form>
    </div>
  </main>

  <script src="/assets/js/auth.js"></script>
  <script>lucide.createIcons();</script>
  <script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
</body>
</html>
